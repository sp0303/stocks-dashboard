[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-workers"
version = "2.0.0"
description = "Portfolio Intelligence v2 background workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pi-core",
    "pi-api",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pi_workers*"]
