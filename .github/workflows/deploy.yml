name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 18

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Copy files to VPS via SSH/SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/var/www/portfolio-dashboard"
          rm: false

      - name: Configure and restart application on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/portfolio-dashboard
            
            # Setup/Activate virtual environment for backend
            cd backend
            if [ ! -d "stocks" ]; then
              python3 -m venv stocks
            fi
            ./stocks/bin/pip install -r requirements.txt
            
            # Create .env file with secrets
            cat <<EOF > .env
            MONGODB_URL=${{ secrets.MONGODB_URL }}
            MONGODB_DB=recruitzaa
            QUOTE_CACHE_TTL_SECONDS=900
            CORS_ORIGINS=*
            CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}
            CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}
            OLLAMA_ENABLED=true
            OLLAMA_BASE_URL=http://127.0.0.1:11434
            OLLAMA_MODEL=qwen3:8b
            EOF

            # Restart application
            # If using systemd (e.g. named portfolio-backend):
            # sudo systemctl restart portfolio-backend || true
            # Or if running backend with PM2:
            # pm2 restart portfolio-backend || pm2 start "./stocks/bin/uvicorn app.main:app --host 0.0.0.0 --port 8010" --name portfolio-backend
