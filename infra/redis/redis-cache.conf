# /etc/redis/redis-cache.conf
# Port 6390: API Response Cache (Eviction: allkeys-lru)

port 6390
bind 127.0.0.1 ::1
protected-mode yes
timeout 0
tcp-keepalive 300
daemonize yes
pidfile /var/run/redis/redis-server-cache.pid
loglevel notice
logfile /var/log/redis/redis-server-cache.log
databases 16

# Cache memory policy: 512MB max, evict oldest keys on full
maxmemory 512mb
maxmemory-policy allkeys-lru

save ""
appendonly no
