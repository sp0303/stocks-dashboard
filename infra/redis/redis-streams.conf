# /etc/redis/redis-streams.conf
# Port 6391: Worker Events & Redis Streams (Persistence: AOF, Eviction: noeviction)

port 6391
bind 127.0.0.1 ::1
protected-mode yes
timeout 0
tcp-keepalive 300
daemonize yes
pidfile /var/run/redis/redis-server-streams.pid
loglevel notice
logfile /var/log/redis/redis-server-streams.log
databases 16

# Event streams cannot drop messages: noeviction
maxmemory 512mb
maxmemory-policy noeviction

# AOF persistence for reliable message replay
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
