# Portfolio Intelligence v2 - nginx vhost, AS DEPLOYED at /etc/nginx/conf.d/portfolio-v2.conf.
# TLS is terminated by Cloudflare (SSL mode "Flexible"), so the origin listens on :80 only.
# Moving to Cloudflare "Full (strict)" needs an origin cert + a 443 server block; see DEPLOYMENT.md.
# Keep this file identical to the box copy (diff it before editing either).

limit_req_zone $binary_remote_addr zone=pi_api_rate:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pi_auth_rate:10m rate=5r/m;

upstream pi_api_upstream {
    server 127.0.0.1:8200;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name v2.sarey.tech;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    root /var/www/portfolio-v2/apps/web/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # A location-level add_header drops the server-level ones, so repeat them.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /api/v1/auth/ {
        limit_req zone=pi_auth_rate burst=5 nodelay;
        proxy_pass http://pi_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=pi_api_rate burst=60;
        proxy_pass http://pi_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # The SPA shell must revalidate so a deploy shows up at once; hashed /assets/ stay immutable.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
